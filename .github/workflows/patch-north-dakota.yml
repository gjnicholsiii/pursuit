name: Patch North Dakota coverage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger North Dakota coverage patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark North Dakota blocked and cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/sled/state-registry-current.ts')
          s = p.read_text()
          marker = '  OR: {\n'
          if '  ND: {' not in s:
              block = '''  ND: {
    connectorFamily: "ivalua",
    platformLabel: "NDBuys / Ivalua",
    officialUrl: "https://public.ndbuys.nd.gov/",
    status: "blocked",
    notes: "North Dakota OMB states that all publicly available NDBuys opportunities for the State and North Dakota University System can be viewed without an account, but CAPTCHA may be required. Production probing confirms the anonymous public solicitation route redirects to Ivalua's browser-check gate, which loads Google reCAPTCHA Enterprise before procurement content is exposed. Pursuit cannot claim deterministic server-side ingestion until an official structured feed or server-accessible public route is available.",
  },
'''
              if marker not in s:
                  raise SystemExit('OR marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          Path('app/api/internal/north-dakota-probe/route.ts').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "Pursuit Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Mark North Dakota procurement coverage blocked"
          git push
