name: Patch New Hampshire coverage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update registry and remove diagnostic route
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/sled/state-registry-current.ts')
          s = p.read_text()
          if 'NH: {' not in s:
              marker = '  NJ: {\n'
              block = '''  NH: {
    connectorFamily: "infor",
    platformLabel: "NHProcurement / New Hampshire Statewide Bids and Proposals",
    officialUrl: "https://apps.das.nh.gov/NHProcurement",
    status: "blocked",
    notes: "Current 2026 New Hampshire DAS bid documents direct vendors to NHProcurement, while legacy solicitations still reference the Statewide Bids and Proposals board. Production probes of both official surfaces return Akamai Access Denied to Vercel before any procurement content is exposed. Pursuit cannot claim deterministic server-side ingestion until an official structured feed or server-accessible route is available.",
  },
'''
              if marker not in s:
                  raise SystemExit('NJ insertion marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          Path('app/api/internal/new-hampshire-probe/route.ts').unlink(missing_ok=True)
          Path('.github/workflows/patch-new-hampshire.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "Pursuit Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Mark New Hampshire procurement coverage blocked"
          git push
