name: Patch Oklahoma coverage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger Oklahoma coverage patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark Oklahoma live and cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/sled/state-registry-current.ts')
          s = p.read_text()
          marker = '  OR: {\n'
          block = '''  OK: {
    connectorFamily: "oracle_peoplesoft",
    platformLabel: "Oklahoma Financials / PeopleSoft Public Bidding Events",
    officialUrl: "https://financials.ok.gov/psc/SOKLFP1DS/SUPPLIER/ERP/c/SCP_PUBLIC_MENU_FL.SCP_PUB_BID_CMP_FL.GBL",
    status: "live",
    notes: "Oklahoma OMES identifies this public Bidding Opportunities page as the statewide source for all current open solicitations, including statewide contract opportunities. Pursuit establishes the anonymous PeopleSoft supplier session, parses the complete public Bidding Event Information grid, reconciles the portal-reported row count before writes, and closes records only after a complete sweep. Production validation reconciled 16 of 16 current bidding events, followed by a stable repeat with no changes.",
  },
'''
          if '  OK: {' not in s:
              if marker not in s:
                  raise SystemExit('OR marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          Path('app/api/internal/oklahoma-probe/route.ts').unlink(missing_ok=True)
          Path('app/api/internal/oklahoma-refresh-once/route.ts').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "Pursuit Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Mark Oklahoma procurement coverage live"
          git push
