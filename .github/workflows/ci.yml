name: Pursuit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pursuit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Next build
        run: npm run build
